[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-retention-ai"
version = "0.1.0"
description = "Customer churn prediction and retention decision support"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
app = ["streamlit>=1.40,<2"]
dev = ["ruff>=0.9,<1"]
notebooks = [
    "jupyterlab>=4,<5",
    "pandas>=2.2,<3",
    "py7zr>=0.20,<2",
    "libarchive-c>=5,<6",
    "matplotlib>=3.10,<4",
    "ipykernel>=6.29,<8",
    "nbclient>=0.10,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["churn_retention*"]

[tool.ruff]
line-length = 100
target-version = "py311"
