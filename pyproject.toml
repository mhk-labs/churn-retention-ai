[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-retention-ai"
version = "0.1.0"
description = "Customer churn prediction and retention decision support"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
app = ["streamlit>=1.40,<2"]
model = ["pandas>=2.2,<3", "pyarrow>=17,<24", "scikit-learn>=1.5,<2", "lightgbm>=4.5,<5", "shap>=0.46,<1"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
notebooks = ["jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
